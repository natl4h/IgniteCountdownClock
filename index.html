<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @font-face {
            font-family: "Gilroy";
            src: url("https://www.dropbox.com/scl/fi/ekpl11rfkzopwst4okmh4/Radomir-Tinkov-Gilroy-Regular.otf?rlkey=81246jckuug172jt7g6wsah1a&st=sk1y18i7&dl=1") format("opentype");
            font-style: normal;
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: "Gilroy";
            src: url("https://www.dropbox.com/scl/fi/1ruscp4hod3dxcbquscr3/Radomir-Tinkov-Gilroy-Bold.otf?rlkey=yezpsl3gx3lp83gx2s64gfem4&st=270np0ya&dl=1") format("opentype");
            font-style: normal;
            font-weight: 700 900;
            font-display: swap;
        }

        :root {
            --green: #339966;
            --dark-green: #004438;
            --white: #ffffff;
        }

        body {
            display: initial;
            margin: 0;
            font-family: "Gilroy", Arial, sans-serif;
            color: var(--white);
        }

        .countdown {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(14px, 2.5vw, 32px);
            box-sizing: border-box;
            width: calc(100% - 24px);
            min-height: 76px;
            margin: 8px 12px;
            padding: 12px 24px;
            border: 2px solid var(--dark-green);
            border-radius: 999px;
            background: rgba(51, 153, 102, 0.3);
            text-align: left;
        }

        .countdown__label,
        .countdown__date,
        .countdown__unit-label {
            margin: 0;
        }

        .countdown__label {
            color: var(--white);
            font-size: clamp(0.7rem, 1.4vw, 0.85rem);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .countdown__time {
            display: flex;
            align-items: center;
            gap: clamp(10px, 2vw, 24px);
        }

        .countdown__unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 42px;
        }

        .countdown__value {
            color: var(--white);
            font-size: clamp(2.15rem, 4.5vw, 3.5rem);
            font-weight: 800;
            line-height: 0.85;
        }

        .countdown__unit-label {
            margin-top: 5px;
            color: var(--white);
            font-size: clamp(0.6rem, 1.2vw, 0.7rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .countdown__date {
            padding-left: clamp(14px, 2.5vw, 32px);
            border-left: 1px solid rgba(255, 255, 255, 0.45);
            color: var(--white);
            font-size: clamp(0.75rem, 1.5vw, 0.9rem);
            white-space: nowrap;
        }

        @media (max-width: 560px) {
            .countdown {
                min-height: 76px;
                padding: 12px 16px;
                gap: 14px;
            }

            .countdown__time {
                gap: 12px;
            }

            .countdown__date {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main class="countdown" aria-live="polite">
        <div class="countdown__time" aria-label="Time remaining">
            <div class="countdown__unit">
                <div class="countdown__value" id="days">0</div>
                <p class="countdown__unit-label">Days</p>
            </div>
            <div class="countdown__unit">
                <div class="countdown__value" id="hours">00</div>
                <p class="countdown__unit-label">Hours</p>
            </div>
            <div class="countdown__unit">
                <div class="countdown__value" id="minutes">00</div>
                <p class="countdown__unit-label">Minutes</p>
            </div>
            <div class="countdown__unit">
                <div class="countdown__value" id="seconds">00</div>
                <p class="countdown__unit-label">Seconds</p>
            </div>
        </div>
        <p class="countdown__label">Until Ignite</p>
        <p class="countdown__date">Wednesday, March 17, 2027 at 4:00 PM</p>
    </main>

    <script>
        const targetDate = new Date(2027, 2, 17, 16, 0, 0);
        const daysElement = document.getElementById('days');
        const hoursElement = document.getElementById('hours');
        const minutesElement = document.getElementById('minutes');
        const secondsElement = document.getElementById('seconds');

        function updateCountdown() {
            const millisecondsRemaining = Math.max(0, targetDate - new Date());
            const totalSeconds = Math.floor(millisecondsRemaining / 1000);
            const daysRemaining = Math.floor(totalSeconds / (60 * 60 * 24));
            const hoursRemaining = Math.floor((totalSeconds % (60 * 60 * 24)) / (60 * 60));
            const minutesRemaining = Math.floor((totalSeconds % (60 * 60)) / 60);
            const secondsRemaining = totalSeconds % 60;

            daysElement.textContent = daysRemaining;
            hoursElement.textContent = String(hoursRemaining).padStart(2, '0');
            minutesElement.textContent = String(minutesRemaining).padStart(2, '0');
            secondsElement.textContent = String(secondsRemaining).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
        console.log('Web Content Loaded');
    </script>
</body>
</html>
