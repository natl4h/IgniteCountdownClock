
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@font-face {
    font-family: "Gilroy";
    src: url("https://www.dropbox.com/scl/fi/ekpl11rfkzopwst4okmh4/Radomir-Tinkov-Gilroy-Regular.otf?rlkey=81246jckuug172jt7g6wsah1a&st=sk1y18i7&dl=1") format("opentype");
    font-weight: 400;
    font-display: swap;
}

@font-face {
    font-family: "Gilroy";
    src: url("https://www.dropbox.com/scl/fi/1ruscp4hod3dxcbquscr3/Radomir-Tinkov-Gilroy-Bold.otf?rlkey=yezpsl3gx3lp83gx2s64gfem4&st=270np0ya&dl=1") format("opentype");
    font-weight: 700 900;
    font-display: swap;
}

:root {
    --green: #339966;
    --dark-green: #004438;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: transparent;
    font-family: "Gilroy", Arial, sans-serif;
    color: var(--white);
}

.countdown {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    width: 100%;
    min-height: 78px;
    margin: 0;
    padding: 10px 14px;
    border: 2px solid var(--dark-green);
    border-radius: 50px;
    background: rgba(51, 153, 102, 0.3);
}

.countdown__time {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vw, 16px);
}

.countdown__unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 32px;
}

.countdown__value {
    color: var(--white);
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 700;
    line-height: 1;
}

.countdown__unit-label {
    margin: 4px 0 0;
    color: var(--white);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
}

.countdown__label {
    margin: 0;
    color: var(--white);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
}

@media (max-width: 560px) {
    .countdown {
        min-height: 68px;
        gap: 10px;
        padding: 9px 8px;
    }

    .countdown__time {
        gap: 7px;
    }

    .countdown__unit {
        min-width: 29px;
    }

    .countdown__value {
        font-size: 23px;
    }

    .countdown__unit-label {
        font-size: 8px;
        letter-spacing: 0.3px;
    }

    .countdown__label {
        font-size: 10px;
        letter-spacing: 0.6px;
    }
}

@media (max-width: 360px) {
    .countdown {
        gap: 6px;
        padding: 8px 5px;
    }

    .countdown__time {
        gap: 5px;
    }

    .countdown__unit {
        min-width: 26px;
    }

    .countdown__value {
        font-size: 20px;
    }

    .countdown__label {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<main class="countdown" aria-live="polite">

    <div class="countdown__time">

        <div class="countdown__unit">
            <div class="countdown__value" id="days">0</div>
            <p class="countdown__unit-label">Days</p>
        </div>

        <div class="countdown__unit">
            <div class="countdown__value" id="hours">00</div>
            <p class="countdown__unit-label">Hours</p>
        </div>

        <div class="countdown__unit">
            <div class="countdown__value" id="minutes">00</div>
            <p class="countdown__unit-label">Minutes</p>
        </div>

        <div class="countdown__unit">
            <div class="countdown__value" id="seconds">00</div>
            <p class="countdown__unit-label">Seconds</p>
        </div>

    </div>

    <p class="countdown__label">Until Ignite</p>

</main>

<script>
const targetDate = new Date(2027, 2, 17, 16, 0, 0);

const daysElement = document.getElementById('days');
const hoursElement = document.getElementById('hours');
const minutesElement = document.getElementById('minutes');
const secondsElement = document.getElementById('seconds');

function updateCountdown() {

    const remaining = Math.max(0, targetDate.getTime() - Date.now());
    const totalSeconds = Math.floor(remaining / 1000);

    daysElement.textContent = Math.floor(totalSeconds / 86400);

    hoursElement.textContent = String(
        Math.floor((totalSeconds % 86400) / 3600)
    ).padStart(2, '0');

    minutesElement.textContent = String(
        Math.floor((totalSeconds % 3600) / 60)
    ).padStart(2, '0');

    secondsElement.textContent = String(
        totalSeconds % 60
    ).padStart(2, '0');
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
